name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev
      - run: pnpm install --frozen-lockfile
      - name: Typecheck and build UI
        run: pnpm build
      - name: Rust tests (unit; database tests skip without servers)
        working-directory: src-tauri
        shell: bash
        run: |
          set +e
          cargo test --lib 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Surface the failure as annotations so it is readable without opening the log.
            grep -E "^error(\[|:)|panicked at|^test .* FAILED|could not compile|^  --> " test.log | head -40 | while IFS= read -r line; do
              echo "::error title=cargo test::${line}"
            done
          fi
          exit "$status"
