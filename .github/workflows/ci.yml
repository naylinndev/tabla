name: CI

on:
  push:
    branches: [main, claude/affectionate-thompson-oaoccp]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev
      - run: pnpm install --frozen-lockfile
      - name: Typecheck and build UI
        run: pnpm build
      - name: Rust tests (unit; database tests skip without servers)
        working-directory: src-tauri
        shell: bash
        run: |
          set +e
          CARGO_TERM_COLOR=never cargo test --lib 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Surface the failure as annotations so it is readable without opening the log.
            sed -E 's/\x1b\[[0-9;]*m//g' test.log > clean.log
            grep -E "error(\[|:)|panicked at|FAILED|could not compile|-->" clean.log | head -30 | while IFS= read -r line; do
              echo "::error title=cargo test::${line}"
            done
            echo "::error title=cargo test (tail)::$(tail -25 clean.log | tr '\n' '|' | cut -c1-3500)"
          fi
          exit "$status"

  # Integration tests against real database servers (service containers).
  databases:
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: tabla_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: tabla_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1" --health-interval 5s --health-timeout 5s --health-retries 30
      redis:
        image: redis:7
        ports: ["6379:6379"]
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        env:
          CLICKHOUSE_DB: tabla_test
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: "tabla-ci-only"
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports: ["8123:8123"]
      mongo:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: "tabla-ci-only"
        ports: ["27017:27017"]
      oracle:
        image: gvenzl/oracle-free:23-slim-faststart
        env:
          # Throwaway container that only lives for this job.
          ORACLE_PASSWORD: "tabla_ci_only"
          APP_USER: "tabla"
          APP_USER_PASSWORD: "tabla_ci_only"
        ports: ["1521:1521"]
        options: >-
          --health-cmd healthcheck.sh --health-interval 10s --health-timeout 5s --health-retries 30
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          # Throwaway container that only lives for this job.
          MSSQL_SA_PASSWORD: "Tabla-ci-only-1"
        ports: ["1433:1433"]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: System libraries and clients
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev postgresql-client mysql-client sqlite3 libaio1
      - name: Oracle Instant Client
        run: |
          curl -sSLo ic.zip https://download.oracle.com/otn_software/linux/instantclient/instantclient-basiclite-linuxx64.zip
          unzip -q ic.zip -d "$RUNNER_TEMP/oracle"
          echo "LD_LIBRARY_PATH=$(ls -d "$RUNNER_TEMP"/oracle/instantclient_*)" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Seed test databases
        run: |
          psql -h 127.0.0.1 -U postgres -d tabla_test -v ON_ERROR_STOP=1 -f tests/fixtures/seed_postgres.sql
          mysql -h 127.0.0.1 -uroot tabla_test < tests/fixtures/seed_mysql.sql
          sqlite3 "$RUNNER_TEMP/tabla_test.db" < tests/fixtures/seed_sqlite.sql
          for i in $(seq 1 60); do
            docker exec ${{ job.services.mssql.id }} /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "Tabla-ci-only-1" -C -b \
              -Q "IF DB_ID('tabla_test') IS NULL CREATE DATABASE tabla_test" && break
            sleep 2
          done
      - name: SQL Server tests
        working-directory: src-tauri
        shell: bash
        env:
          TABLA_TEST_MSSQL: "127.0.0.1:1433:sa:tabla_test"
          TABLA_TEST_MSSQL_PASSWORD: "Tabla-ci-only-1"
        run: |
          set +e
          CARGO_TERM_COLOR=never cargo test --lib mssql -- --nocapture --test-threads=1 2>&1 | tee mssql.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E "error(\[|:)|panicked at|FAILED|-->|overflow|left:|right:" mssql.log | tail -25 | while IFS= read -r line; do
              echo "::error title=sql server tests::${line}"
            done
          fi
          exit "$status"
      - name: Integration tests
        if: always()
        working-directory: src-tauri
        shell: bash
        env:
          TABLA_TEST_PG: "127.0.0.1:5432:postgres:tabla_test"
          TABLA_TEST_MYSQL: "127.0.0.1:3306:root:tabla_test"
          TABLA_TEST_REDIS: "127.0.0.1:6379:9"
          TABLA_TEST_CLICKHOUSE: "127.0.0.1:8123:default:tabla_test"
          TABLA_TEST_CLICKHOUSE_PASSWORD: "tabla-ci-only"
          TABLA_TEST_MONGO: "127.0.0.1:27017:root:tabla_test"
          TABLA_TEST_MONGO_PASSWORD: "tabla-ci-only"
          TABLA_TEST_ORACLE: "127.0.0.1:1521:tabla:FREEPDB1"
          TABLA_TEST_ORACLE_PASSWORD: "tabla_ci_only"
        run: |
          export TABLA_TEST_SQLITE="$RUNNER_TEMP/tabla_test.db"
          export TABLA_CONFIG_DIR="$RUNNER_TEMP/tabla-config"
          set +e
          CARGO_TERM_COLOR=never cargo test --lib -- --skip mssql 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E "error(\[|:)|panicked at|FAILED|could not compile|-->" test.log | head -30 | while IFS= read -r line; do
              echo "::error title=integration tests::${line}"
            done
          fi
          exit "$status"
