name: Release

# Run this workflow by hand with a version to build
# installers for macOS (Apple Silicon + Intel), Windows and Linux and attach
# them to a draft GitHub Release. Publishing that draft creates the tag (which
# doesn't rebuild anything) and, when the tap token is configured, updates the
# Homebrew cask.
# No tag-push trigger: publishing a release creates its tag, and that must not
# rebuild (and replace) the installers that were just published.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.1.0 (must match tauri.conf.json)"
        required: true
      homebrew_only:
        description: "Only update the Homebrew cask for this already-published version"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    # Publishing a release only updates Homebrew; the installers already exist.
    if: github.event_name != 'release' && !inputs.homebrew_only
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rust_targets: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
            rust_targets: ""
          - platform: windows-latest
            args: ""
            rust_targets: ""
    runs-on: ${{ matrix.platform }}
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
      HAS_APPLE_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && vars.TAURI_UPDATER_PUBKEY != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux system libraries
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev
      - run: pnpm install --frozen-lockfile
      - name: Check the version
        shell: bash
        run: |
          APP=$(node -p 'require("./src-tauri/tauri.conf.json").version')
          if [ "v$APP" != "$TAG" ]; then
            echo "::error::Release $TAG does not match tauri.conf.json version $APP"
            exit 1
          fi

      # Code signing switches on automatically once these secrets exist
      # (Apple Developer ID). Without them the build is unsigned.
      - name: Enable macOS signing
        if: runner.os == 'macOS' && env.HAS_APPLE_SIGNING == 'true'
        run: |
          {
            echo "APPLE_CERTIFICATE=${{ secrets.APPLE_CERTIFICATE }}"
            echo "APPLE_CERTIFICATE_PASSWORD=${{ secrets.APPLE_CERTIFICATE_PASSWORD }}"
            echo "APPLE_SIGNING_IDENTITY=${{ secrets.APPLE_SIGNING_IDENTITY }}"
            echo "APPLE_ID=${{ secrets.APPLE_ID }}"
            echo "APPLE_PASSWORD=${{ secrets.APPLE_PASSWORD }}"
            echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}"
          } >> "$GITHUB_ENV"

      # One-click in-app updates switch on once the updater key exists (see
      # packaging/homebrew/README.md). The build then signs its update bundles,
      # attaches latest.json to the release, and embeds the public key.
      - name: Enable signed in-app updates
        if: env.HAS_UPDATER_KEY == 'true'
        shell: bash
        env:
          PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          node -e '
            const conf = { bundle: { createUpdaterArtifacts: true }, plugins: { updater: {
              pubkey: process.env.PUBKEY.trim(),
              endpoints: ["https://github.com/naylinndev/tabla/releases/latest/download/latest.json"] } } };
            require("fs").writeFileSync("src-tauri/tauri.updater.conf.json", JSON.stringify(conf, null, 2));'
          echo "UPDATER_ARGS=--config src-tauri/tauri.updater.conf.json" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.TAG }}
          releaseName: Tabla ${{ env.TAG }}
          releaseBody: |
            See the README for install options. macOS: `brew tap naylinndev/tabla && brew install --cask tabla`.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }} ${{ env.UPDATER_ARGS }}

  homebrew:
    needs: build
    runs-on: ubuntu-latest
    # Only once the release is published: a draft's files can't be downloaded by tag.
    if: always() && (github.event_name == 'release' || inputs.homebrew_only)
    steps:
      - uses: actions/checkout@v5
      - name: Update the Homebrew cask
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.event_name == 'release' && github.ref_name || format('v{0}', inputs.version) }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN is not set; skipping the cask update."
            exit 0
          fi
          VERSION="${TAG#v}"
          mkdir dl
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "*.dmg" --dir dl
          ARM=$(sha256sum "dl/Tabla_${VERSION}_aarch64.dmg" | cut -d' ' -f1)
          INTEL=$(sha256sum "dl/Tabla_${VERSION}_x64.dmg" | cut -d' ' -f1)
          sed -e "s/__VERSION__/${VERSION}/" -e "s/__SHA_ARM__/${ARM}/" -e "s/__SHA_INTEL__/${INTEL}/" \
            packaging/homebrew/tabla.rb > tabla.rb
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${GITHUB_REPOSITORY_OWNER}/homebrew-tabla.git" tap
          mkdir -p tap/Casks
          cp tabla.rb tap/Casks/tabla.rb
          cd tap
          git config user.name "tabla-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/tabla.rb
          git commit -m "tabla ${VERSION}" || exit 0
          git push origin HEAD
