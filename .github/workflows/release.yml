name: Release

# Push a tag like v0.2.0 to build installers for macOS (Apple Silicon + Intel),
# Windows and Linux, attach them to a draft GitHub Release, and (when the tap
# token is configured) update the Homebrew cask.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rust_targets: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
            rust_targets: ""
          - platform: windows-latest
            args: ""
            rust_targets: ""
    runs-on: ${{ matrix.platform }}
    env:
      HAS_APPLE_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux system libraries
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev
      - run: pnpm install --frozen-lockfile

      # Code signing switches on automatically once these secrets exist
      # (Apple Developer ID). Without them the build is unsigned.
      - name: Enable macOS signing
        if: runner.os == 'macOS' && env.HAS_APPLE_SIGNING == 'true'
        run: |
          {
            echo "APPLE_CERTIFICATE=${{ secrets.APPLE_CERTIFICATE }}"
            echo "APPLE_CERTIFICATE_PASSWORD=${{ secrets.APPLE_CERTIFICATE_PASSWORD }}"
            echo "APPLE_SIGNING_IDENTITY=${{ secrets.APPLE_SIGNING_IDENTITY }}"
            echo "APPLE_ID=${{ secrets.APPLE_ID }}"
            echo "APPLE_PASSWORD=${{ secrets.APPLE_PASSWORD }}"
            echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}"
          } >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Tabla ${{ github.ref_name }}
          releaseBody: |
            See the README for install options. macOS: `brew install --cask naylinndev/tabla/tabla`.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  homebrew:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Update the Homebrew cask
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN is not set; skipping the cask update."
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir dl
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern "*.dmg" --dir dl
          ARM=$(sha256sum "dl/Tabla_${VERSION}_aarch64.dmg" | cut -d' ' -f1)
          INTEL=$(sha256sum "dl/Tabla_${VERSION}_x64.dmg" | cut -d' ' -f1)
          sed -e "s/__VERSION__/${VERSION}/" -e "s/__SHA_ARM__/${ARM}/" -e "s/__SHA_INTEL__/${INTEL}/" \
            packaging/homebrew/tabla.rb > tabla.rb
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${GITHUB_REPOSITORY_OWNER}/homebrew-tabla.git" tap
          mkdir -p tap/Casks
          cp tabla.rb tap/Casks/tabla.rb
          cd tap
          git config user.name "tabla-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/tabla.rb
          git commit -m "tabla ${VERSION}" || exit 0
          git push
