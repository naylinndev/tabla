[package]
name = "tabla"
version = "0.1.0"
description = "Tabla — a free, open-source database client"
authors = ["Tabla contributors"]
license = "MIT"
repository = "https://github.com/naylinndev/tabla"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tabla_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres", "mysql", "sqlite"] }
tokio = { version = "1.53.2", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
futures-util = "0.3.34"
uuid = { version = "1.28.0", features = ["v4"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
tauri-plugin-dialog = "2.8.1"
thiserror = "2.0.21"
dirs = "7.0.0"
russh = "0.64.1"
redis = { version = "1.7.1", features = ["tokio-comp", "connection-manager", "tokio-rustls-comp"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
tauri-plugin-opener = "2"
tiberius = { version = "0.13.0", default-features = false, features = ["rustls", "tds73", "chrono"] }
tokio-util = { version = "0.7.20", features = ["compat"] }
chrono = "0.4.45"
reqwest = { version = "0.13", default-features = false, features = ["query", "rustls", "stream"] }
duckdb = { version = "1.10506.0", features = ["bundled", "json", "parquet"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }
